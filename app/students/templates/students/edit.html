<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">
<h2>Edit Student</h2>
</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">
<input
type="text"
name="name"
class="form-control"
value="{{ student.name }}"
required>
</div>

<div class="mb-3">
<input
type="text"
name="roll_number"
class="form-control"
value="{{ student.roll_number }}"
required>
</div>

<div class="mb-3">
<input
type="text"
name="department"
class="form-control"
value="{{ student.department }}"
required>
</div>

<button class="btn btn-success">
Update Student
</button>

<a href="/" class="btn btn-secondary">
Cancel
</a>

</form>

</div>

</div>

</div>

</body>
</html>
